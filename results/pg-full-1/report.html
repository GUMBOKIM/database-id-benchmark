<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID 벤치마크 결과</title>
<style>
:root {
	color-scheme: light;
	--surface-0: #f4f3ef;
	--surface-1: #fcfcfb;
	--text-primary: #0b0b0b;
	--text-secondary: #52514e;
	--text-muted: #77766f;
	--grid: #e6e5df;
	--axis: #b9b8b0;
	--border: #dddcd5;
	--ref: #77766f;
	--s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
	--s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--surface-0: #111110; --surface-1: #1a1a19;
		--text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #96958c;
		--grid: #2c2c2a; --axis: #4a4a46; --border: #33332f; --ref: #96958c;
		--s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
		--s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
	}
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--surface-0: #111110; --surface-1: #1a1a19;
	--text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #96958c;
	--grid: #2c2c2a; --axis: #4a4a46; --border: #33332f; --ref: #96958c;
	--s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
	--s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 32px 0 8px; }
h2.group { font-size: 19px; margin: 48px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
h3.metric { font-size: 15px; margin: 24px 0 8px; }
.sub { color: var(--text-secondary); margin: 0 0 16px; }
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
select { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
.env { color: var(--text-secondary); font-size: 13px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row.single { grid-template-columns: 1fr; }
.legend .grp { color: var(--text-muted); font-weight: 600; margin-left: 4px; }
.legend .grp:first-child { margin-left: 0; }
@media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 12px 4px; position: relative; min-width: 0; }
.card h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--text-secondary); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { flex: none; }
.legend span { cursor: default; }
svg.chart .line { transition: opacity 0.12s; }
svg.chart.focus .line:not(.on) { opacity: 0.12; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--text-muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); display: none; z-index: 2; min-width: 170px; }
.tip .h { color: var(--text-secondary); margin-bottom: 4px; }
.tip .r { display: grid; grid-template-columns: 14px auto 1fr; gap: 6px; align-items: center; }
.tip .r b { text-align: left; font-variant-numeric: tabular-nums; }
.tip .r i { color: var(--text-secondary); font-style: normal; }
details { margin: 6px 0 0; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
.hostcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 8px 0 16px; }
.hostcard h2 { font-size: 15px; margin: 0 0 8px; }
.hostcard table { margin: 0; }
.hostcard th { text-align: left; color: var(--text-secondary); font-weight: 500; }
.hostcard td { text-align: left; white-space: normal; }
.hostcard .note { color: var(--text-secondary); font-size: 12px; margin: 8px 0 0; }
.warn { border-left: 3px solid var(--s8); padding: 6px 10px; margin: 10px 0 0; font-size: 13px; background: var(--surface-0); border-radius: 4px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 12px; margin: 8px 0; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
</style>
</head>

	const show = () => {
		const n = xs[idx];
		hair.setAttribute('x1', X(n)); hair.setAttribute('x2', X(n)); hair.setAttribute('visibility', 'visible');
		dots.replaceChildren(); dots.setAttribute('visibility', 'visible');
		tip.replaceChildren();
		const size = D.data[$('#db').value].bytes_row?.[REF]?.find((p) => p.n === n);
		const head = el('div', { class: 'h' }, `N = ${n.toLocaleString()}`);
		if (size) head.textContent += ` · autoinc 테이블+인덱스 ${(size.med * n / 2 ** 20).toFixed(0)} MiB`;
		tip.append(head);
		for (const s of series) { const p = s.pts.find((q) => q.n === n); if (p) dots.append(svgEl('circle', { cx: X(n), cy: Y(p.med), r: 4, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 })); }
		const rows = series.flatMap((g) => g.members.map((s) => ({ s: { ...s, color: g.color, ref: g.ref, dash: g.dash }, p: s.pts.find((p) => p.n === n) })))
			.filter((r) => r.p).sort((a, b) => b.p.med - a.p.med);
		for (const { s, p } of rows) {
			const r = el('div', { class: 'r' });
			const key = svgEl('svg', { width: 14, height: 4 });
			key.append(svgEl('line', { x1: 0, x2: 14, y1: 2, y2: 2, stroke: s.color, 'stroke-width': 2, ...(s.dash ? { 'stroke-dasharray': s.dash } : {}) }));
			r.append(key, el('b', {}, fmtV(p.med, metric.unit)), el('i', {}, s.label + (p.reps > 1 ? ` (${fmtV(p.min)}–${fmtV(p.max)})` : '')));
			tip.append(r);
		}
		const box = svg.getBoundingClientRect(), cb = card.getBoundingClientRect();
		const px = box.left - cb.left + (X(n) / W) * box.width;
		tip.style.display = 'block';
		const left = px + 14 + tip.offsetWidth > cb.width ? px - 14 - tip.offsetWidth : px + 14;
		tip.style.left = `${Math.max(4, left)}px`;
		tip.style.top = `${box.top - cb.top + 8}px`;
	};
	const hide = () => { hair.setAttribute('visibility', 'hidden'); dots.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; };
	hit.addEventListener('pointermove', (e) => {
		const box = svg.getBoundingClientRect();
		const vx = ((e.clientX - box.left) / box.width) * W;
		idx = xs.reduce((best, n, i) => (Math.abs(X(n) - vx) < Math.abs(X(xs[best]) - vx) ? i : best), 0);
		show();
	});
	hit.addEventListener('pointerleave', hide);
	hit.addEventListener('focus', show);
	hit.addEventListener('blur', hide);
	hit.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowLeft') { idx = Math.max(0, idx - 1); show(); e.preventDefault(); }
		if (e.key === 'ArrowRight') { idx = Math.min(xs.length - 1, idx + 1); show(); e.preventDefault(); }
	});
}

// IDs whose lines lie on top of each other would hide one another: draw them once and
// name them together. "=" when the values match (e.g. UUID v6 and v7 have the same size),
// "≈" when they only coincide on screen (90% of points within 2px, none further than 12px).
// The tooltip still lists each ID's own value.
function mergeSame(series, Y) {
	const aligned = (a, b) => a.pts.length === b.pts.length && a.pts.every((p, i) => p.n === b.pts[i].n);
	const equal = (a, b) => aligned(a, b) && a.pts.every((p, i) => {
		const q = b.pts[i].med;
		return Math.abs(p.med - q) <= 0.005 * Math.max(Math.abs(p.med), Math.abs(q), 1e-9);
	});
	const onScreen = (a, b) => {
		if (!aligned(a, b)) return false;
		const d = a.pts.map((p, i) => Math.abs(Y(p.med) - Y(b.pts[i].med)));
		return d.filter((x) => x <= 2).length >= 0.9 * d.length && Math.max(...d) <= 12;
	};
	const out = [];
	for (const s of series) {
		const g = out.find((o) => onScreen(o.members[0], s));
		if (g) {
			g.label += equal(g.members[0], s) ? ` = ${s.label}` : ` ≈ ${s.label}`;
			g.key += `,${s.id}`;
			g.members.push(s);
		} else out.push({ ...s, key: s.id, members: [s] });
	}
	return out;
}

function table(metric, byType) {
	const ns = [...new Set(Object.values(byType).flat().map((p) => p.n))].sort((a, b) => a - b);
	const pick = ns.filter((n) => Number.isInteger(Math.log10(n)) || n === ns.at(-1));
	const wrap = el('div', { class: 'tablewrap' });
	const t = el('table');
	const hr = el('tr'); hr.append(el('th', {}, 'ID'), ...pick.map((n) => el('th', {}, `N=${fmtN(n)}`)));
	t.append(hr);
	for (const id of [REF, ...SORTED, ...RANDOM]) {
		if (!byType[id]) continue;
		const tr = el('tr'); tr.append(el('td', {}, D.types[id].label));
		for (const n of pick) { const p = byType[id].find((q) => q.n === n); tr.append(el('td', {}, p ? fmtV(p.med, metric.unit) : '')); }
		t.append(tr);
	}
	wrap.append(t);
	return wrap;
}

function render() {
	const db = $('#db').value;
	const m = D.meta[db];
	$('#env').textContent = `${String(m.env.version).split(' ').slice(0, 2).join(' ')} · 캐시 ${m.env.cache} · 반복 ${m.reps.length}회`;
	const root = $('#charts');
	root.replaceChildren();
	let lastGroup = null;
	for (const metric of D.metrics) {
		const byType = D.data[db][metric.key];
		if (!Object.keys(byType).length) continue;
		if (metric.group !== lastGroup) { root.append(el('h2', { class: 'group' }, metric.group)); lastGroup = metric.group; }
		root.append(el('h3', { class: 'metric' }, metric.title));
		const panels = panelsFor(byType);
		const row = el('div', { class: panels.length === 1 ? 'row single' : 'row' });
		root.append(row);
		for (const panel of panels) {
			// Combined chart: sorted IDs first, then random; random ones dashed.
			const ids = panel.ids.filter((id) => byType[id]).sort((a, b) => (panel.combined ? D.types[b].sorted - D.types[a].sorted : 0));
			if (!ids.length) continue;
			const raw = ids.map((id) => ({ id, label: D.types[id].label, color: color(panel, id), pts: byType[id], dash: panel.combined && !D.types[id].sorted ? RANDOM_DASH : null }));
			if (byType[REF]) raw.unshift({ id: REF, label: `${D.types[REF].label} (기준)`, color: 'var(--ref)', pts: byType[REF], ref: true, dash: panel.combined ? null : '5 4' });
			const card = el('div', { class: 'card' });
			if (panel.title) card.append(el('h3', {}, panel.title));
			row.append(card);
			chart(card, metric, raw, panel);
		}
		const det = el('details'); det.append(el('summary', {}, '표로 보기 (반복 중앙값)'), table(metric, byType));
		root.append(det);
	}
}

// The machine and Docker engine of the run (results/<RUN_ID>/host.json).
function hostCard() {
	const h = D.host;
	const m = Object.values(D.meta)[0];
	const gib = (b) => `${(b / 2 ** 30).toFixed(1)} GiB`;
	const card = el('div', { class: 'hostcard' });
	card.append(el('h2', {}, '측정 환경'));
	const rows = [];
	if (h) {
		rows.push(['CPU', `${h.cpu} · ${h.cores}코어 ${h.threads}스레드 · L3 ${h.l3} · 최대 ${Math.round(Number(h.maxMHz))} MHz`]);
		rows.push(['클럭 설정', `거버너 ${h.governor} · 부스트 ${h.boost === '1' ? '켜짐' : h.boost === '0' ? '꺼짐' : h.boost}`]);
		rows.push(['메모리', gib(h.memoryBytes)]);
		rows.push(['디스크', `${h.dockerDiskModel} (${h.dockerDisk}), Docker 데이터가 있는 디스크`]);
		rows.push(['OS', `${h.os} · 커널 ${h.kernel}`]);
		rows.push(['Docker', h.docker.desktopVm
			? `Docker Desktop (VM: CPU ${h.docker.cpus}개, 메모리 ${gib(h.docker.memoryBytes)}) · ${h.docker.version}`
			: `네이티브 Docker Engine ${h.docker.version} · cgroup ${h.docker.cgroupDriver}`]);
		rows.push(['CPU 고정', `DB ${h.dbCpus} · 실행기 ${h.runnerCpus}`]);
	}
	rows.push(['DB', `${String(m.env.version).split(' ').slice(0, 2).join(' ')} · 설정 기본값 (캐시 ${m.env.cache}) · 메모리, 디스크 I/O 제한 없음`]);
	const t = el('table');
	for (const [k, v] of rows) { const tr = el('tr'); tr.append(el('th', {}, k), el('td', {}, v)); t.append(tr); }
	card.append(t);
	if (!h) card.append(el('p', { class: 'note' }, '이 실행에는 하드웨어 기록(host.json)이 없어요.'));
	else if (h.recordedAfterRun) card.append(el('p', { class: 'note' }, `측정이 끝난 뒤 같은 PC에서 기록한 정보예요 (${h.recordedAt.slice(0, 10)}). 클럭 설정은 측정 당시와 다를 수 있어요.`));
	if (h?.docker.desktopVm) {
		card.append(el('p', { class: 'warn' },
			'Docker Desktop(VM)에서 돌린 결과예요. CPU 고정은 VM의 가상 CPU에 걸리고, 커밋은 VM 디스크를 거쳐 더 느리고 들쭉날쭉해요. ' +
			'"캐시를 비운 직후" 측정은 VM 안의 캐시만 비워서, 호스트가 캐시한 VM 디스크에서 읽혔을 수 있어요(실제 디스크 읽기보다 빠름). ' +
			'ID끼리의 비교는 같은 조건이라 유효해요.'));
	}
	$('#host').append(card);
}
hostCard();

function genTable() {
	const g = D.generation;
	const ids = [...SORTED, ...RANDOM].filter((id) => g[id]).sort((a, b) => g[a].nsPerId - g[b].nsPerId);
	if (!ids.length) return;
	const det = el('details');
	det.append(el('summary', {}, `ID 생성 시간 (앱에서 미리 생성, ${g[ids[0]].n.toLocaleString()}개 기준, 삽입 시간에는 포함 안 됨)`));
	const wrap = el('div', { class: 'tablewrap' });
	const t = el('table');
	const hr = el('tr'); hr.append(el('th', {}, 'ID'), el('th', {}, '개당 생성 시간'));
	t.append(hr);
	for (const id of ids) { const tr = el('tr'); tr.append(el('td', {}, D.types[id].label), el('td', {}, fmtV(g[id].nsPerId / 1000, 'µs'))); t.append(tr); }
	wrap.append(t); det.append(wrap);
	$('#gen').append(det);
}
genTable();

const c = Object.values(D.meta)[0].config;
$('#sub').textContent = `${D.run} · 테이블을 ${c.nMin.toLocaleString()}행에서 ${c.nMax.toLocaleString()}행까지 키우며 10배 구간마다 ${c.pointsPerDecade}번 측정 · 한 건 삽입 ${c.singleW}번, 조회 ${c.readN}번씩 · x축은 행 수(log)`;
for (const db of Object.keys(D.meta)) $('#db').append(el('option', { value: db }, db));
$('#db').addEventListener('change', render);
render();
</script>

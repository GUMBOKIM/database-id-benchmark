# Databases run with their default settings and no memory or I/O limits.
# bench.sh starts ONE database at a time.
#
# CPU: the database and the runner are pinned to different CCDs of the Ryzen 7950X
# (logical CPUs 0-7,16-23 and 8-15,24-31), so they do not even share an L3 cache.
# Needs the native Docker Engine; under Docker Desktop these are VM CPUs and mean little.
#
# Images are pinned by digest so a rerun gets exactly the same builds.
x-db: &db
  cpuset: ${DB_CPUS:-0-7,16-23}
  profiles: [db] # never started by a bare `docker compose up`

services:
  postgres:
    <<: *db
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements # statistics only
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 1s
      retries: 120

  mysql:
    <<: *db
    image: mysql:8.4.11@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_DATABASE: bench
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -pbench]
      interval: 1s
      retries: 180

  mariadb:
    <<: *db
    image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    environment:
      MARIADB_ROOT_PASSWORD: bench
      MARIADB_DATABASE: bench
    command:
      - --performance-schema=ON # statistics only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 1s
      retries: 180

  # Runs gen.js / bench.js / report.js.
  runner:
    image: node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    cpuset: ${RUNNER_CPUS:-8-15,24-31}
    mem_limit: 4g
    profiles: [runner]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Linux install, separate from the host's
    environment:
      - RUN_ID
      - REP
      - TYPES
      - N_MIN
      - N_MAX
      - POINTS_PER_DECADE
      - BATCH
      - SINGLE_W
      - READ_N
      - READ_WARMUP
      - RECENT_FRAC
      - RECENT_SHARE

volumes:
  node_modules:
